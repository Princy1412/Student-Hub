<body>

    <h1>⚙️ Settings</h1>

    <form>

        <fieldset>
            <legend>👤 Profile Settings</legend>

            <label>Change Name:</label><br>
            <input type="text" placeholder="Enter your name"><br><br>

            <label>Change Email:</label><br>
            <input type="email" placeholder="Enter your email"><br><br>

            <label>Change Password:</label><br>
            <input type="password" placeholder="Enter new password">
        </fieldset>

        <fieldset>
            <legend>🎨 Appearance</legend>

            <label>Theme:</label><br>
            <input type="radio" name="theme"> Light
            <input type="radio" name="theme"> Dark

            <br><br>

            <label>Font Size:</label><br>
            <input type="radio" name="font"> Small
            <input type="radio" name="font"> Medium
            <input type="radio" name="font"> Large
        </fieldset>

        <fieldset>
            <legend>🔔 Notifications</legend>

            <input type="checkbox"> Attendance Alerts<br>
            <input type="checkbox"> Assignment Reminders<br>
            <input type="checkbox"> Event Notifications
        </fieldset>

        <fieldset>
            <legend>🌐 Language</legend>

            <select>
                <option>English</option>
                <option>Gujarati</option>
                <option>Hindi</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>🔒 Privacy</legend>

            <input type="checkbox"> Show Profile to Others<br>
            <input type="checkbox"> Hide Email
        </fieldset>

        <fieldset>
            <legend>📧 Account</legend>

            <label>Change Password:</label><br>
            <input type="password" placeholder="New Password"><br><br>

            <input type="submit" value="Save Changes">
            <input type="reset" value="Reset">
            <button type="button">Logout</button>
        </fieldset>

    </form>

    <a href="home2.html">🔙 Back To Home</a>

</body>

</html>
