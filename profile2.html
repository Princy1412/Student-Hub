<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="profile">

<div class="profile-box">

<h1>👤 Student Profile</h1>

<hr>

<table>

    <tr>
        <td><b>Name</b></td>
        <td><input type="text" placeholder="Enter Name"></td>
    </tr>

    <tr>
        <td><b>ID</b></td>
        <td><input type="text" placeholder="Enter ID"></td>
    </tr>

    <tr>
        <td><b>Email</b></td>
        <td><input type="email" placeholder="Enter Email"></td>
    </tr>

    <tr>
        <td><b>Semester</b></td>
        <td><input type="text" placeholder="Enter Semester"></td>
    </tr>

    <tr>
        <td><b>Course</b></td>
        <td><input type="text" placeholder="Enter Course"></td>
    </tr>

    <tr>
        <td><b>Phone Number</b></td>
        <td><input type="tel" placeholder="Enter Phone Number"></td>
    </tr>

</table>

<div class="button">
    <a href="home2.html" class="back-home">🏠 Back To Home</a>
</div>

</div>

</body>

</html>
