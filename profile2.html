<body class="profile">

<div class="profile-box">

<h1>👤 Student Profile</h1>

<hr>

<table>

    <tr>
        <td><b>Name</b></td>
        <td><input type="text" placeholder="Enter Name"></td>
    </tr>

    <tr>
        <td><b>ID</b></td>
        <td><input type="text" placeholder="Enter ID"></td>
    </tr>

    <tr>
        <td><b>Email</b></td>
        <td><input type="email" placeholder="Enter Email"></td>
    </tr>

    <tr>
        <td><b>Semester</b></td>

    </tr>

    <tr>
        <td><b>Course</b></td>

    </tr>

    <tr>

    </tr>
