<body>

<div class="register-box">

<h1>📝 Event Registration</h1>

<hr>

<form>

<label>👤 Full Name</label><br>
<input type="text" placeholder="Enter your full name"><br><br>

<label>🆔 Roll Number</label><br>
<input type="text" placeholder="Enter your roll number"><br><br>

<label>📧 Email</label><br>
<input type="email" placeholder="Enter your email"><br><br>

<label>📞 Phone Number</label><br>
<input type="tel" placeholder="Enter your phone number"><br><br>

<label>📚 Semester</label><br>
<input type="text" placeholder="Enter your semester"><br><br>

<label>🎉 Select Event</label><br>

<select>
    <option>24-Hour Coding Challenge</option>
    <option>AI & Machine Learning Workshop</option>
    <option>Web Development Bootcamp</option>
</select>

<br><br>

<label>💬 Why do you want to participate?</label><br>

<textarea rows="5" placeholder="Write your answer here..."></textarea>

<div class="buttons">
    <input type="submit" value="Register">
    <input type="reset" value="Reset">
</div>

</form>

<div class="back">
    <a href="events2.html">⬅️ Back to Events</a>
</div>

</div>

</body>
