<body class="signup">

<div class="signup-box">

    <h1>📝 Sign Up</h1>

    <hr>

    <form>

        <label>🆔 Student ID</label><br>
        <input type="text" placeholder="Enter Student ID"><br><br>

        <label>🔒 Password</label><br>
        <input type="password" placeholder="Create Password"><br><br>

        <label>🔒 Confirm Password</label><br>
        <input type="password" placeholder="Confirm Password"><br><br>

        <input type="checkbox"> I accept Terms & Conditions

        <div class="button">
            <input type="submit" value="Register">
            <input type="reset" value="Reset">
        </div>

    </form>

    <div class="links">
        <p>Already have an account?</p>

        <a href="login2.html">🔑 Login</a>

        <br><br>

        <a href="home2.html" class="back-home">🏠 Back To Home</a>
    </div>

</div>
